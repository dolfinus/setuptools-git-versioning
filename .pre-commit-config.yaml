repos:

  - repo: meta
    hooks:
      - id: check-hooks-apply
        priority: 0
      - id: check-useless-excludes
        priority: 0

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
        priority: 0
      - id: check-merge-conflict
        priority: 0
      - id: check-toml
        priority: 0
      - id: check-vcs-permalinks
        priority: 0
      - id: name-tests-test
        files: ^tests\/test_(unit|integration)\/.*\.py$
        args: [--django]
        priority: 0
      - id: detect-private-key
        priority: 0
      - id: end-of-file-fixer
        priority: 1
      - id: fix-byte-order-marker
        priority: 2
      - id: trailing-whitespace
        priority: 3

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: rst-backticks
        priority: 0
      - id: rst-directive-colons
        priority: 0
      - id: rst-inline-touching-normal
        priority: 0

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-tabs
        priority: 0
      - id: remove-tabs
        args: [--whitespaces-count, '2']
        priority: 4

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: uv.lock
        args: [-w]
        priority: 4

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-yaml
        args: [--autofix, --indent, '2', --offset, '2']
        priority: 5

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7
    hooks:
      - id: uv-lock
        priority: 5

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        language: system
        entry: ruff format .
        types: [python]
        pass_filenames: false
        priority: 5

      - id: ruff-check
        name: ruff-check
        language: system
        entry: ruff check --fix
        types: [python]
        pass_filenames: false
        priority: 6

      - id: mypy
        name: mypy
        entry: mypy setuptools_git_versioning
        language: python
        types: [python]
        require_serial: true
        pass_filenames: false
        priority: 7

ci:
  skip:
    - mypy # checked with Github Actions
    - ruff-format # checked with Github Actions
    - ruff-check # checked with Github Actions
